name: Quality checks (Railway waits for CI)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Lint, engine & multiplayer tests, build, browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # Railway's native GitHub source has checkSuites=true in .railway/railway.ts.
  # It deploys main after this workflow passes, without a long-lived CI token.
